name: Coleta mensal

on:
  schedule:
    - cron: '0 9 1 * *'   # todo dia 1º do mês, 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:       # permite rodar na mão (aba Actions > Run workflow)

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar dados e gerar páginas
        run: python coleta/coletar.py
        env:
          SITE_URL: https://olhardobrasil.caioandersonmartins.workers.dev
      - name: Salvar mudanças
        run: |
          git config user.name "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Atualização mensal de dados" && git push)
